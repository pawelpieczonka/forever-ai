# Builds the Windows and the Linux app from the same commit. Pull requests get both builds as workflow artifacts, and
# the version job checks that a pull request changing the apps bumps the version (.github/version_check.py). A push
# to main publishes them as the GitHub Release v<version> when the version in the source has no release yet (bump the
# version to release); pushing a tag v<version> does the same:
#   ForeverAI-<version>-Windows-x64.zip     -> ForeverAI-Windows/ForeverAI-Windows.exe
#   ForeverAI-<version>-Linux-x86_64.tar.gz -> ForeverAI-Linux/ForeverAI-Linux
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install -r companion/requirements.txt -c companion/constraints.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Lua syntax (the add-on)
        run: for f in addon/ForeverAI/*.lua; do luac5.1 -p "$f"; done
      - name: Tests
        working-directory: companion
        # lua5.1 is installed first: the auction test runs the add-on's Lua with it, and the simulator test checks the
        # add-on's globals with luac5.1
        run: python -m pytest -q

  version:
    # a pull request that changes the apps raises the version by one step, so merging it publishes a release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version step
        env:
          BASE: origin/${{ github.base_ref }}
        run: python3 .github/version_check.py "$BASE"

  build-linux:
    needs: test
    # the oldest supported runner: the app runs on distributions with the same or a newer glibc (2.35)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tk from the distribution
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tk-dev
      - name: Virtual environment
        run: |
          python -m venv companion/.venv
          companion/.venv/bin/python -m pip install -r companion/requirements.txt pyinstaller -c companion/constraints.txt
      - name: Tkinter uses the system Tk (a standalone Tk has no font rendering)
        run: |
          tkso="$(companion/.venv/bin/python -c 'import _tkinter; print(_tkinter.__file__)')"
          ldd "$tkso" | tee /dev/stderr | grep -E '=> /(usr/)?lib/x86_64-linux-gnu/libtk8\.6\.so'
      - name: Build
        run: ./build_linux.sh --package
      - name: Smoke test
        run: |
          app=release/linux/ForeverAI-Linux
          usage="$("$app/ForeverAI-Linux" --help)"
          grep -q "usage: foreverai" <<< "$usage"
          test -f "$app/_internal/seed/kb.sqlite"
          want="$(grep '^## Version:' addon/ForeverAI/ForeverAI.toc)"
          got="$(grep '^## Version:' "$app/_internal/addon/ForeverAI/ForeverAI.toc")"
          [ "$want" = "$got" ] || { echo "add-on version $got, source $want"; exit 1; }
          listing="$(tar -tzvf release/ForeverAI-*-Linux-x86_64.tar.gz ForeverAI-Linux/ForeverAI-Linux)"
          grep -q '^-rwx' <<< "$listing"
          # API keys: the credential store that foreverai/keystore.py imports is in the bundle
          modules="$(companion/.venv/bin/pyi-archive_viewer --recursive --brief "$app/ForeverAI-Linux")"
          for m in keyring.backends.SecretService secretstorage jeepney cryptography; do
            grep -qx " $m" <<< "$modules" || { echo "not bundled: $m"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverAI-Linux
          path: release/ForeverAI-*-Linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Virtual environment
        run: |
          python -m venv companion\.venv
          companion\.venv\Scripts\python.exe -m pip install -r companion\requirements.txt pyinstaller -c companion\constraints.txt
      - name: API keys go to Windows Credential Manager
        working-directory: companion
        run: .venv\Scripts\python.exe -c "from foreverai import keystore as k; assert k.available(), 'no credential store'; assert k.put('FOREVERAI_CI_CHECK', 'ok'); k.reset(); assert k.get('FOREVERAI_CI_CHECK') == 'ok'"
      - name: Build
        run: .\build_exe.ps1 -Package
      - name: Smoke test
        run: |
          $app = "release\windows\ForeverAI-Windows"
          if (-not (Test-Path "$app\ForeverAI-Windows.exe")) { throw "no exe" }
          if (-not (Test-Path "$app\_internal\seed\kb.sqlite")) { throw "no seed knowledge base" }
          $want = Select-String -Path addon\ForeverAI\ForeverAI.toc -Pattern '^## Version:' | ForEach-Object Line
          $got = Select-String -Path "$app\_internal\addon\ForeverAI\ForeverAI.toc" -Pattern '^## Version:' | ForEach-Object Line
          if ($want -ne $got) { throw "add-on version $got, source $want" }
          # API keys: the credential store that foreverai/keystore.py imports is in the bundle
          $modules = & companion\.venv\Scripts\pyi-archive_viewer.exe --recursive --brief "$app\ForeverAI-Windows.exe"
          if (-not ($modules -contains " keyring.backends.Windows")) { throw "not bundled: keyring.backends.Windows" }
          if (-not ($modules -contains " win32ctypes.pywin32.win32cred")) { throw "not bundled: win32ctypes.pywin32.win32cred" }
          if (-not ($modules -match '^ win32ctypes\.core\.(cffi|ctypes)\._authentication$')) { throw "not bundled: win32ctypes backend" }
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverAI-Windows
          path: release/ForeverAI-*-Windows-x64.zip
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v4
      - name: Version to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -oP '__version__ = "\K[^"]+' companion/foreverai/__init__.py)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, source $version"; exit 1
          fi
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is already released; bump the version to publish a new release"
          else
            echo "PUBLISH=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v4
        if: env.PUBLISH == '1'
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        if: env.PUBLISH == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum ForeverAI-* > SHA256SUMS.txt
          cat > notes.md <<EOF
          ## Download

          | File | Platform |
          |---|---|
          | \`ForeverAI-$VERSION-Windows-x64.zip\` | **Windows 10/11**: extract, run \`ForeverAI-Windows/ForeverAI-Windows.exe\` |
          | \`ForeverAI-$VERSION-Linux-x86_64.tar.gz\` | **Linux** (WoW Forever under Wine): extract, run \`ForeverAI-Linux/ForeverAI-Linux\` |

          No Python needed. The Linux app runs on distributions with glibc 2.35 or newer (Ubuntu 22.04, Debian 12 and later).
          EOF
          # creates the tag v<version> on this commit unless it was pushed
          gh release create "v$VERSION" ForeverAI-* SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ForeverAI $VERSION" --notes-file notes.md --generate-notes
